<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">全球线路与节点连接示意图</title>
  <desc id="desc">深蓝色地球、经纬线、连接弧线以及香港、日本、新加坡、美国和欧洲节点。</desc>
  <defs>
    <radialGradient id="ocean" cx="36%" cy="28%" r="78%">
      <stop offset="0" stop-color="#425b7e"/>
      <stop offset="0.58" stop-color="#243b5a"/>
      <stop offset="1" stop-color="#17283e"/>
    </radialGradient>
    <linearGradient id="orbit" x1="70" y1="80" x2="650" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7757ff"/>
      <stop offset="0.5" stop-color="#16a8dd"/>
      <stop offset="1" stop-color="#2bbf83"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#263b59" flood-opacity="0.2"/>
    </filter>
    <clipPath id="globeClip"><circle cx="360" cy="280" r="190"/></clipPath>
  </defs>

  <g opacity=".5" fill="none" stroke="#d7d4ea">
    <circle cx="360" cy="280" r="246"/>
    <circle cx="360" cy="280" r="226" stroke-dasharray="3 13"/>
  </g>

  <circle cx="360" cy="280" r="190" fill="url(#ocean)" filter="url(#shadow)"/>
  <g clip-path="url(#globeClip)">
    <g fill="none" stroke="#8da4c0" stroke-opacity=".34" stroke-width="1.4">
      <ellipse cx="360" cy="280" rx="144" ry="190"/>
      <ellipse cx="360" cy="280" rx="78" ry="190"/>
      <ellipse cx="360" cy="280" rx="190" ry="71"/>
      <ellipse cx="360" cy="280" rx="190" ry="137"/>
      <path d="M170 280h380M360 90v380"/>
    </g>

    <g fill="#6e83a0" fill-opacity=".68">
