      <path d="M305 205l31-17 43 7 18 22 35 5 20 27-12 28-29 4-15 20-28-8-19-31-31-19-24-14z"/>
      <path d="M388 123l49-6 36 15 13 25-18 15-21-8-20 15-36-7-19-25z"/>
      <path d="M440 201l35 10 20 24-8 31-22 11-7 34-23 26-21-9 6-31-18-21 14-25-11-22z"/>
      <path d="M287 315l31 8 19 26-13 34-18 14-5 31-18 13-16-20 5-30-18-27 10-31z"/>
      <path d="M470 356l32 4 18 20-12 19-28-3-18-18z"/>
    </g>

    <g fill="none" stroke="#9cdcf2" stroke-opacity=".62" stroke-width="2">
      <path d="M271 225Q360 154 456 227"/>
      <path d="M271 225Q342 333 437 348"/>
      <path d="M456 227Q389 282 333 309"/>
      <path d="M333 309Q402 331 437 348"/>
    </g>
  </g>

  <g fill="none" stroke="url(#orbit)" stroke-linecap="round">
