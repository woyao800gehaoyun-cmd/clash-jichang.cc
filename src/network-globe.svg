    <ellipse cx="360" cy="280" rx="264" ry="92" stroke-width="2.2" transform="rotate(27 360 280)" opacity=".82"/>
    <path d="M139 403C209 170 471 88 597 178" stroke-width="2.4" opacity=".78"/>
